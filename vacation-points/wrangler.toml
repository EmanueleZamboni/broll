# Il nome del Worker deve combaciare con il "Project name" scelto su Cloudflare.
name = "vacanza"
main = "src/index.js"
compatibility_date = "2025-08-01"

# Il sito (HTML/CSS/JS) viene servito da qui, le API le gestisce il Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Il database dei punti. Va creato una volta sola su Cloudflare
# (Storage & Databases → D1 → Create), chiamandolo "vacanza": poi il suo
# Database ID va incollato qui sotto. Le tabelle se le crea da sola l'app.
[[d1_databases]]
binding = "DB"
database_name = "vacanza"
database_id = "INCOLLA_QUI_L_ID_DEL_DATABASE"

# Il codice per entrare e la chiave che firma le sessioni NON stanno qui:
# vanno messi come variabili cifrate (Encrypt) nelle impostazioni del Worker,
# altrimenti ogni deploy li sovrascriverebbe. Se non ci sono, il codice è
# "vacanza".
#   ROOM_CODE    — il codice che dite agli altri tre
#   AUTH_SECRET  — una stringa lunga a caso
