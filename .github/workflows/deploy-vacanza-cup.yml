name: Deploy Vacanza Cup

# Parte a ogni push sul branch dell'app, oppure a mano dal tab Actions.
on:
  push:
    branches: [claude/vacation-points-system-joeyhd]
    paths: ['vacation-points/**', '.github/workflows/deploy-vacanza-cup.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vacation-points
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: vacanza

    steps:
      - uses: actions/checkout@v4

      # Senza token non si fallisce: si spiega cosa manca e ci si ferma qui.
      - name: C'è il token Cloudflare?
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Manca il token Cloudflare"
              echo
              echo "Aggiungi il secret **CLOUDFLARE_API_TOKEN** in"
              echo "*Settings → Secrets and variables → Actions → New repository secret*,"
              echo "poi rilancia questo workflow."
              echo
              echo "È l'unica cosa obbligatoria. Il resto se lo arrangia il workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vacation-points/package-lock.json

      - run: npm ci
        if: steps.check.outputs.ok == 'true'

      - name: Crea il database D1 se non c'è, e mettine l'id in wrangler.toml
        if: steps.check.outputs.ok == 'true'
        run: |
          set -euo pipefail
          find_id() {
            npx wrangler d1 list --json 2>/dev/null \
              | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | (.uuid // .database_id)' \
              | head -1
          }
          ID="$(find_id)"
          if [ -z "$ID" ]; then
            echo "Il database non esiste ancora, lo creo."
            npx wrangler d1 create "$DB_NAME"
            ID="$(find_id)"
          fi
          if [ -z "$ID" ]; then
            echo "::error::Non sono riuscito a ottenere l'id del database D1."
            exit 1
          fi
          echo "Database $DB_NAME -> $ID"
          sed -i "s/INCOLLA_QUI_L_ID_DEL_DATABASE/$ID/" wrangler.toml

      - name: Crea le tabelle (le istruzioni sono IF NOT EXISTS, si può rilanciare)
        if: steps.check.outputs.ok == 'true'
        run: npx wrangler d1 execute "$DB_NAME" --remote --file=./schema.sql

      # Un valore in [vars] sovrascriverebbe il secret a ogni deploy, quindi si
      # toglie. Il controllo sta nello script: negli "if" di step il contesto
      # "secrets" non è ammesso e il workflow non parte nemmeno.
      - name: Se il codice vacanza arriva dai secret, toglilo da wrangler.toml
        if: steps.check.outputs.ok == 'true'
        env:
          ROOM_CODE: ${{ secrets.ROOM_CODE }}
        run: |
          if [ -n "${ROOM_CODE:-}" ]; then
            sed -i '/^ROOM_CODE = /d' wrangler.toml
            echo "Il codice vacanza arriva dai secret."
          fi

      - name: Deploy
        if: steps.check.outputs.ok == 'true'
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          URL="$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' deploy.log | head -1 || true)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Segreti del Worker (l'unica cosa da fare a mano è il token)
        id: segreti
        if: steps.check.outputs.ok == 'true'
        env:
          ROOM_CODE: ${{ secrets.ROOM_CODE }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          set -uo pipefail
          # Il codice per entrare: se non lo si è impostato resta quello di default.
          if [ -n "${ROOM_CODE:-}" ]; then
            printf '%s' "$ROOM_CODE" | npx wrangler secret put ROOM_CODE
            echo "codice=dai secret" >> "$GITHUB_OUTPUT"
          else
            echo "codice=vacanza (predefinito)" >> "$GITHUB_OUTPUT"
          fi

          # La chiave che firma le sessioni non deve chiederla a nessuno: se non
          # c'è già sul Worker, se ne genera una e resta quella per sempre.
          GIA_PRESENTE=$(npx wrangler secret list --json 2>/dev/null | jq -r '.[]?.name' | grep -Fxc 'AUTH_SECRET')
          if [ -n "${AUTH_SECRET:-}" ]; then
            printf '%s' "$AUTH_SECRET" | npx wrangler secret put AUTH_SECRET
            echo "Chiave delle sessioni presa dai secret."
          elif [ "${GIA_PRESENTE:-0}" = "0" ]; then
            openssl rand -hex 32 | tr -d '\n' | npx wrangler secret put AUTH_SECRET
            echo "Chiave delle sessioni generata adesso (resta questa)."
          else
            echo "Chiave delle sessioni già presente, lasciata com'è."
          fi

      - name: Scrivi il link nel riepilogo
        if: steps.check.outputs.ok == 'true'
        run: |
          {
            echo "## 👑 Vacanza Cup è online"
            echo
            if [ -n "${{ steps.deploy.outputs.url }}" ]; then
              echo "**${{ steps.deploy.outputs.url }}**"
            else
              echo "Deploy fatto. Il link è nel log dello step \"Deploy\"."
            fi
            echo
            echo "Codice per entrare: ${{ steps.segreti.outputs.codice }}"
            echo
            echo "Manda il link agli altri tre: aprono, scelgono chi sono, scrivono il codice."
          } >> "$GITHUB_STEP_SUMMARY"
